study_name: hsp_official
description: Official pilot, ablation, and hyperparameter queue for paper tables.
base_config: RL_stage/examples/config_hsp.yaml
output_root: ${INFOBUY_STORE}/experiments
checkpoint_root: ${INFOBUY_CKPT}/rl
launcher: RL_stage/examples/qwen3_hsp_grpo.sh

defaults:
  gpu: "0"
  model_path: ${INFOBUY_CKPT}/sft/qwen3-0.6b-hsp-sft
  teacher_port: 7778

experiments:
  - name: main
    run_name: qwen3_hsp_grpo_main
    config: RL_stage/examples/config_hsp.yaml
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_main

  - name: shaped
    run_name: qwen3_hsp_grpo_shaped
    config: RL_stage/examples/config_hsp_shaped.yaml
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_shaped

  - name: no_cost
    run_name: qwen3_hsp_grpo_no_cost
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_no_cost
      worker.reward.reward_function_kwargs.teacher_cost_weight: 0.0
      worker.val_reward.reward_function_kwargs.teacher_cost_weight: 0.0

  - name: cost_low
    run_name: qwen3_hsp_grpo_cost_005
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_cost_005
      worker.reward.reward_function_kwargs.teacher_cost_weight: 0.05
      worker.val_reward.reward_function_kwargs.teacher_cost_weight: 0.05

  - name: cost_high
    run_name: qwen3_hsp_grpo_cost_030
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_cost_030
      worker.reward.reward_function_kwargs.teacher_cost_weight: 0.30
      worker.val_reward.reward_function_kwargs.teacher_cost_weight: 0.30

  - name: trust_low
    run_name: qwen3_hsp_grpo_trust_025
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_trust_025
      worker.reward.reward_function_kwargs.wrong_accept_weight: 0.25
      worker.val_reward.reward_function_kwargs.wrong_accept_weight: 0.25
      worker.reward.reward_function_kwargs.wrong_reject_weight: 0.25
      worker.val_reward.reward_function_kwargs.wrong_reject_weight: 0.25
      worker.reward.reward_function_kwargs.wrong_implicit_adoption_weight: 0.25
      worker.val_reward.reward_function_kwargs.wrong_implicit_adoption_weight: 0.25

  - name: trust_high
    run_name: qwen3_hsp_grpo_trust_080
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_trust_080
      worker.reward.reward_function_kwargs.wrong_accept_weight: 0.80
      worker.val_reward.reward_function_kwargs.wrong_accept_weight: 0.80
      worker.reward.reward_function_kwargs.wrong_reject_weight: 0.80
      worker.val_reward.reward_function_kwargs.wrong_reject_weight: 0.80
      worker.reward.reward_function_kwargs.wrong_implicit_adoption_weight: 0.80
      worker.val_reward.reward_function_kwargs.wrong_implicit_adoption_weight: 0.80

  - name: budget_small
    run_name: qwen3_hsp_grpo_budget_small
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_budget_small
      worker.rollout.ask_budget_tokens: 32
      worker.rollout.verify_budget_tokens: 48
      worker.reward.reward_function_kwargs.teacher_token_budget: 80.0
      worker.val_reward.reward_function_kwargs.teacher_token_budget: 80.0

  - name: budget_large
    run_name: qwen3_hsp_grpo_budget_large
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_budget_large
      worker.rollout.ask_budget_tokens: 96
      worker.rollout.verify_budget_tokens: 128
      worker.reward.reward_function_kwargs.teacher_token_budget: 224.0
      worker.val_reward.reward_function_kwargs.teacher_token_budget: 224.0

  - name: interactions_1
    run_name: qwen3_hsp_grpo_interactions_1
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_interactions_1
      worker.rollout.max_interactions: 1

  - name: interactions_4
    run_name: qwen3_hsp_grpo_interactions_4
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_interactions_4
      worker.rollout.max_interactions: 4

  - name: kl_low
    run_name: qwen3_hsp_grpo_kl_003
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_kl_003
      algorithm.kl_coef: 0.003

  - name: kl_high
    run_name: qwen3_hsp_grpo_kl_030
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_kl_030
      algorithm.kl_coef: 0.03

  - name: lr_low
    run_name: qwen3_hsp_grpo_lr_3e-7
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_lr_3e-7
      worker.actor.optim.lr: 3.0e-7

  - name: lr_high
    run_name: qwen3_hsp_grpo_lr_3e-6
    overrides:
      trainer.experiment_name: qwen3_hsp_grpo_lr_3e-6
      worker.actor.optim.lr: 3.0e-6
